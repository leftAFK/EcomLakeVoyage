services:

  kafka:
    image: apache/kafka:3.9.2
    container_name: kafka
    hostname: kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_CONFIG_STORAGE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_OFFSET_STORAGE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_STATUS_STORAGE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DEFAULT_TOPIC_PARTITIONS: 1
      TZ: Asia/Shanghai

    networks:
      - bigdata-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      TZ: Asia/Shanghai
    networks:
      - bigdata-net

  mysql:
    image: mysql:8.0
    container_name: mysql
    hostname: mysql
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --character-set-client-handshake=FALSE --default-time-zone=+08:00
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: demo
      LANG: C.UTF-8
      TZ: Asia/Shanghai
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    networks:
      - bigdata-net

  connect:
    image: debezium/connect:2.5
    container_name: connect
    hostname: connect
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: connect-config
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status
      TZ: Asia/Shanghai
    depends_on:
      - kafka
      - mysql
    networks:
      - bigdata-net

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: clickhouse
    hostname: clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    mem_limit: 2g
    volumes:
      - ./clickhouse/data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d
      - ./clickhouse/config:/etc/clickhouse-server/users.d
    environment:
      CLICKHOUSE_DB: demo
      TZ: Asia/Shanghai
    networks:
      - bigdata-net

  # ========== Doris FE (升级到 3.1.3) ==========
  doris-fe:
    image: apache/doris:fe-3.1.3
    container_name: doris-fe
    hostname: doris-fe
    ports:
      - "8030:8030"
      - "9030:9030"
    environment:
      - FE_SERVERS=fe1:172.22.0.10:9010
      - FE_ID=1
      - TZ=Asia/Shanghai
    volumes:
      - ./doris/fe/conf/fe.conf:/opt/apache-doris/fe/conf/fe.conf
      - ./doris/fe/doris-meta:/opt/apache-doris/fe/doris-meta
      - ./doris/fe/log:/opt/apache-doris/fe/log
      - /Users/ok/bigdata/docker/paimon_warehouse:/opt/flink/paimon_warehouse
    networks:
      bigdata-net:
        ipv4_address: 172.22.0.10

  # ========== Doris BE (升级到 3.1.3) ==========
  doris-be:
    image: apache/doris:be-3.1.3
    container_name: doris-be
    hostname: doris-be
    privileged: true
    depends_on:
      - doris-fe
    ports:
      - "8040:8040"
      - "9050:9050"
    mem_limit: 6g
    memswap_limit: 6g
    environment:
      - FE_SERVERS=fe1:172.22.0.10:9010
      - BE_ADDR=172.22.0.11:9050
      - TZ=Asia/Shanghai
    volumes:
      - ./doris/be/conf/be.conf:/opt/apache-doris/be/conf/be.conf
      - ./doris/be/storage:/opt/apache-doris/be/storage
      - ./doris/be/log:/opt/apache-doris/be/log
      - /Users/ok/bigdata/docker/paimon_warehouse:/opt/flink/paimon_warehouse
    networks:
      bigdata-net:
        ipv4_address: 172.22.0.11

  jobmanager:
    build: .
    container_name: flink-jobmanager
    hostname: jobmanager
    command: jobmanager
    ports:
      - "8081:8081"
    environment:
      JOB_MANAGER_RPC_ADDRESS: jobmanager
      TZ: Asia/Shanghai
    volumes:
      - ./conf:/opt/flink/conf
      - ./sql:/opt/flink/sql
      - ./pyflink:/opt/flink/usrlib
      - ./data:/data
      - ./lib/hive-standalone-metastore-3.1.3.jar:/opt/flink/lib/hive-standalone-metastore-3.1.3.jar
      - ./lib/hive-metastore-3.1.3.jar:/opt/flink/lib/hive-metastore-3.1.3.jar
      - ./lib/hive-common-3.1.3.jar:/opt/flink/lib/hive-common-3.1.3.jar
      - ./lib/hive-serde-3.1.3.jar:/opt/flink/lib/hive-serde-3.1.3.jar
      - ./lib/hive-exec-3.1.3.jar:/opt/flink/lib/hive-exec-3.1.3.jar
      - ./lib/libthrift-0.9.3.jar:/opt/flink/lib/libthrift-0.9.3.jar
      - ./lib/libfb303-0.9.3.jar:/opt/flink/lib/libfb303-0.9.3.jar
      - ./lib/hive-shims-3.1.3.jar:/opt/flink/lib/hive-shims-3.1.3.jar
      - ./lib/hive-shims-common-3.1.3.jar:/opt/flink/lib/hive-shims-common-3.1.3.jar
      - ./lib/hive-shims-0.23-3.1.3.jar:/opt/flink/lib/hive-shims-0.23-3.1.3.jar
      - ./lib/hive-shims-scheduler-3.1.3.jar:/opt/flink/lib/hive-shims-scheduler-3.1.3.jar
      # Kafka Connector
      - ./lib/flink-sql-connector-kafka-3.4.0-1.20.jar:/opt/flink/lib/flink-sql-connector-kafka-3.4.0-1.20.jar
      # JSON Format
      - ./lib/flink-json-1.20.0.jar:/opt/flink/lib/flink-json-1.20.0.jar
      # HBase Connector
      - ./lib/flink-sql-connector-hbase-2.2-4.0.0-1.19.jar:/opt/flink/lib/flink-sql-connector-hbase-2.2-4.0.0-1.19.jar
      # Iceberg Flink Runtime
      - ./lib/iceberg-flink-runtime-1.20-1.7.1.jar:/opt/flink/lib/iceberg-flink-runtime-1.20-1.7.1.jar
      # Flink Shaded Hadoop (for Iceberg)
      - ./lib/flink-shaded-hadoop-2-uber-2.8.3-10.0.jar:/opt/flink/lib/flink-shaded-hadoop-2-uber-2.8.3-10.0.jar
      # Iceberg warehouse
      - ./iceberg_warehouse:/opt/flink/iceberg_warehouse
      # CSV 输出目录
      - ./data/csv:/opt/flink/output
      # ClickHouse JDBC
      - ./lib/clickhouse-jdbc-0.5.0.jar:/opt/flink/lib/clickhouse-jdbc-0.5.0.jar
      # Flink JDBC Connector
      - ./lib/flink-connector-jdbc-3.1.2-1.18.jar:/opt/flink/lib/flink-connector-jdbc-3.1.2-1.18.jar
      # MySQL JDBC Driver
      - ./lib/mysql-connector-java-8.0.28.jar:/opt/flink/lib/mysql-connector-java-8.0.28.jar
      # ClickHouse Flink SQL Connector
      - ./lib/flink-sql-connector-clickhouse-1.19.0-1.0.0.jar:/opt/flink/lib/flink-sql-connector-clickhouse-1.19.0-1.0.0.jar
      # ========== Flink CDC Connectors（SQL 模式）==========
      - ./lib/flink-doris-connector-1.20-25.1.0.jar:/opt/flink/lib/flink-doris-connector-1.20-25.1.0.jar
      - ./lib/flink-sql-connector-mysql-cdc-3.3.0.jar:/opt/flink/lib/flink-sql-connector-mysql-cdc-3.3.0.jar
      # paimon
      - ./lib/paimon-flink-1.20-1.0.0.jar:/opt/flink/lib/paimon-flink-1.20-1.0.0.jar
      - ./paimon_warehouse:/opt/flink/paimon_warehouse
    depends_on:
      - kafka
      - mysql
    networks:
      - bigdata-net

  taskmanager:
    build: .
    container_name: flink-taskmanager
    hostname: taskmanager
    command: taskmanager
    depends_on:
      - jobmanager
    environment:
      JOB_MANAGER_RPC_ADDRESS: jobmanager
      TZ: Asia/Shanghai
    volumes:
      - ./conf:/opt/flink/conf
      - ./sql:/opt/flink/sql
      - ./pyflink:/opt/flink/usrlib
      - ./data:/data
      - ./lib/hive-standalone-metastore-3.1.3.jar:/opt/flink/lib/hive-standalone-metastore-3.1.3.jar
      - ./lib/hive-metastore-3.1.3.jar:/opt/flink/lib/hive-metastore-3.1.3.jar
      - ./lib/hive-common-3.1.3.jar:/opt/flink/lib/hive-common-3.1.3.jar
      - ./lib/hive-serde-3.1.3.jar:/opt/flink/lib/hive-serde-3.1.3.jar
      - ./lib/hive-exec-3.1.3.jar:/opt/flink/lib/hive-exec-3.1.3.jar
      - ./lib/libthrift-0.9.3.jar:/opt/flink/lib/libthrift-0.9.3.jar
      - ./lib/libfb303-0.9.3.jar:/opt/flink/lib/libfb303-0.9.3.jar
      - ./lib/hive-shims-3.1.3.jar:/opt/flink/lib/hive-shims-3.1.3.jar
      - ./lib/hive-shims-common-3.1.3.jar:/opt/flink/lib/hive-shims-common-3.1.3.jar
      - ./lib/hive-shims-0.23-3.1.3.jar:/opt/flink/lib/hive-shims-0.23-3.1.3.jar
      - ./lib/hive-shims-scheduler-3.1.3.jar:/opt/flink/lib/hive-shims-scheduler-3.1.3.jar
      # Kafka Connector
      - ./lib/flink-sql-connector-kafka-3.4.0-1.20.jar:/opt/flink/lib/flink-sql-connector-kafka-3.4.0-1.20.jar
      # JSON Format
      - ./lib/flink-json-1.20.0.jar:/opt/flink/lib/flink-json-1.20.0.jar
      # HBase Connector
      - ./lib/flink-sql-connector-hbase-2.2-4.0.0-1.19.jar:/opt/flink/lib/flink-sql-connector-hbase-2.2-4.0.0-1.19.jar
      # Iceberg Flink Runtime
      - ./lib/iceberg-flink-runtime-1.20-1.7.1.jar:/opt/flink/lib/iceberg-flink-runtime-1.20-1.7.1.jar
      # Flink Shaded Hadoop (for Iceberg)
      - ./lib/flink-shaded-hadoop-2-uber-2.8.3-10.0.jar:/opt/flink/lib/flink-shaded-hadoop-2-uber-2.8.3-10.0.jar
      # Iceberg warehouse
      - ./iceberg_warehouse:/opt/flink/iceberg_warehouse
      # CSV 输出目录
      - ./data/csv:/opt/flink/output
      # ClickHouse JDBC
      - ./lib/clickhouse-jdbc-0.5.0.jar:/opt/flink/lib/clickhouse-jdbc-0.5.0.jar
      # Flink JDBC Connector
      - ./lib/flink-connector-jdbc-3.1.2-1.18.jar:/opt/flink/lib/flink-connector-jdbc-3.1.2-1.18.jar
      # MySQL JDBC Driver
      - ./lib/mysql-connector-java-8.0.28.jar:/opt/flink/lib/mysql-connector-java-8.0.28.jar
      # ClickHouse Flink SQL Connector
      - ./lib/flink-sql-connector-clickhouse-1.19.0-1.0.0.jar:/opt/flink/lib/flink-sql-connector-clickhouse-1.19.0-1.0.0.jar
      # ========== Flink CDC Connectors（SQL 模式）==========
      - ./lib/flink-doris-connector-1.20-25.1.0.jar:/opt/flink/lib/flink-doris-connector-1.20-25.1.0.jar
      - ./lib/flink-sql-connector-mysql-cdc-3.3.0.jar:/opt/flink/lib/flink-sql-connector-mysql-cdc-3.3.0.jar
      #paimon
      - ./lib/paimon-flink-1.20-1.0.0.jar:/opt/flink/lib/paimon-flink-1.20-1.0.0.jar
      - ./paimon_warehouse:/opt/flink/paimon_warehouse
    networks:
      - bigdata-net

networks:
  bigdata-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/16
