# ============================================================
# Prometheus 采集配置
# 采集目标：Flink JobManager/TaskManager + Doris FE/BE + Node Exporter
# ============================================================

global:
  scrape_interval: 15s          # 采集间隔 15s
  evaluation_interval: 15s       # 规则评估间隔 15s
  scrape_timeout: 10s            # 采集超时 10s

# ========== 采集目标 ==========
scrape_configs:
  # ---------- Flink JobManager 指标 ----------
  - job_name: "flink-jobmanager"
    metrics_path: /jobmanager/metrics
    static_configs:
      - targets: ["flink-jobmanager:8081"]
        labels:
          service: "flink"
          role: "jobmanager"

  # # ---------- Flink TaskManager 指标 ----------
  # - job_name: "flink-taskmanager"
  #   metrics_path: /taskmanager/metrics
  #   static_configs:
  #     - targets: ["flink-taskmanager:8082"]
  #       labels:
  #         service: "flink"
  #         role: "taskmanager"

  # ---------- Doris FE 指标 ----------
  - job_name: "doris-fe"
    metrics_path: /metrics
    static_configs:
      - targets: ["doris-fe:8030"]
        labels:
          service: "doris"
          role: "fe"

  # ---------- Doris BE 指标 ----------
  - job_name: "doris-be"
    metrics_path: /metrics
    static_configs:
      - targets: ["doris-be:8040"]
        labels:
          service: "doris"
          role: "be"

  # ---------- Node Exporter（宿主机指标） ----------
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: "host"

  # ---------- Prometheus 自身 ----------
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: "prometheus"

# ========== 告警规则（可选） ----------
# rule_files:
#   - /etc/prometheus/rules/*.yml
